<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A little surprise for you 💝</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff1ee;--bg2:#fbd9d3;--gold:#b8860b;--gold2:#d4a94a;--text:#6b4a3f;--card:rgba(255,255,255,.65);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b1a1d;--bg2:#4a2a30;--gold:#f0c866;--gold2:#e2b857;--text:#f6dcd5;--card:rgba(255,255,255,.08)}}
:root[data-theme="dark"]{--bg1:#2b1a1d;--bg2:#4a2a30;--gold:#f0c866;--gold2:#e2b857;--text:#f6dcd5;--card:rgba(255,255,255,.08)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 30% 20%,var(--bg1),var(--bg2));color:var(--text);font-family:Poppins,system-ui,sans-serif;overflow:hidden}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
.screen{position:absolute;inset:0;padding-top:76px !important;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow-y:auto;animation:in .8s ease}
.screen.active{display:flex}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
h1,h2{font-family:'Playfair Display',serif;color:var(--gold);margin:.3em 0}
h1{font-size:clamp(2.2rem,9vw,4rem);text-shadow:0 2px 12px rgba(212,169,74,.4)}
h2{font-size:clamp(1.6rem,6vw,2.4rem)}
p{max-width:480px;line-height:1.6;font-weight:300}
.btn{margin-top:22px;border:0;cursor:pointer;font:500 1rem Poppins,sans-serif;color:#fff;padding:14px 34px;border-radius:40px;background:linear-gradient(135deg,var(--gold2),#e8a49c);box-shadow:0 6px 20px rgba(212,169,74,.45);transition:transform .2s}
.btn:active{transform:scale(.96)}
.glow{animation:glow 2s infinite ease-in-out}
@keyframes glow{0%,100%{box-shadow:0 0 10px rgba(212,169,74,.5)}50%{box-shadow:0 0 34px 8px rgba(255,200,120,.85)}}
.big{font-size:4rem;animation:beat 1.4s infinite}
@keyframes beat{50%{transform:scale(1.15)}}
.slide{width:min(86vw,360px);aspect-ratio:4/5;border-radius:22px;background:var(--card);backdrop-filter:blur(6px);border:2px solid var(--gold2);display:flex;align-items:center;justify-content:center;font-size:5rem;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.slide img{width:100%;height:100%;object-fit:cover}
#cap{min-height:4.5em;margin-top:14px}
.dots{display:flex;gap:8px;margin-top:6px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--gold2);opacity:.3}.dots i.on{opacity:1}
.row{display:flex;gap:12px;align-items:center}
.gifts{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:560px;margin-top:10px}
.gift{width:140px;padding:18px 10px;border-radius:20px;background:var(--card);border:1.5px solid var(--gold2);opacity:0;transform:scale(.5) rotate(-8deg);transition:all .7s cubic-bezier(.2,1.4,.4,1)}
.gift.show{opacity:1;transform:none}
.gift b{display:block;font:700 1.1rem 'Playfair Display',serif;color:var(--gold)}
.gift span{font-size:2.6rem;display:block}.gift small{font-weight:300}
.wishes{display:flex;flex-direction:column;gap:14px;width:min(92vw,460px);max-height:58vh;overflow-y:auto;padding:4px}
.wish{background:var(--card);border:1.5px solid var(--gold2);border-radius:18px;padding:14px;text-align:left}
.wish b{color:var(--gold);font-family:'Playfair Display',serif}
.wish img,.wish video{width:100%;border-radius:12px;margin-top:8px}
.logo{height:120px;margin-bottom:4px;mix-blend-mode:multiply;border-radius:14px}
#brand{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);height:58px;z-index:9;mix-blend-mode:multiply;border-radius:10px;pointer-events:none}
body.last #brand{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #brand,:root:not([data-theme="light"]) .logo{mix-blend-mode:normal}}
:root[data-theme="dark"] #brand,:root[data-theme="dark"] .logo{mix-blend-mode:normal}
a.link{color:var(--gold);font-weight:500}
#mute{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:10;border:0;background:var(--card);border-radius:50%;width:40px;height:40px;font-size:1.1rem;cursor:pointer;display:none}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<img id="brand" alt="Unsaid" style="display:none">
<button id="mute" aria-label="Toggle music">🔊</button>

<!-- 1 Scan -->
<section class="screen active" id="s0">
  <div class="big">💝</div>
  <h2>A little surprise for you</h2>
  <p>Something made with love is waiting inside…</p>
  <button class="btn glow" onclick="openGift()">Tap to Open</button>
</section>

<!-- 2 Anniversary -->
<section class="screen" id="s1">
  <p style="letter-spacing:.3em;text-transform:uppercase;font-size:.8rem">Dear <span class="fname"></span></p>
  <h1>Happy Anniversary!</h1>
  <p id="annMsg"></p>
  <button class="btn" onclick="go(2)">See our story →</button>
</section>

<!-- 3 Story -->
<section class="screen" id="s2">
  <h2>Your Story</h2>
  <div class="slide" id="slide"></div>
  <p id="cap"></p>
  <div class="dots" id="dots"></div>
  <div class="row"><button class="btn" onclick="slideBy(-1)">‹</button><button class="btn" onclick="slideBy(1)">›</button></div>
  <button class="btn" id="storyNext" style="display:none" onclick="go(3)">Next</button>
</section>

<!-- 4 Wait -->
<section class="screen" id="s3">
  <div class="big">🎁</div>
  <h2>Please wait…</h2>
  <p>Something special is coming 🎁</p>
  <button class="btn glow" onclick="go(4)">Next</button>
</section>

<!-- 5 Gifts -->
<section class="screen" id="s4">
  <h2>Your Gifts, <span class="fname"></span> ✨</h2>
  <div class="gifts" id="gifts"></div>
  <button class="btn" id="giftNext" style="display:none" onclick="go(5)">Next</button>
</section>

<!-- 6 Family -->
<section class="screen" id="s5">
  <h2>Wishes from Family 💌</h2>
  <div class="wishes" id="wishes"></div>
  <button class="btn" onclick="go(6)">Next</button>
</section>

<!-- 7 Close -->
<section class="screen" id="s6">
  <img class="logo" id="logo" alt="" style="display:none">
  <div class="big">💖</div>
  <h1 style="font-size:clamp(1.8rem,7vw,3rem)">With love, <span id="you"></span></h1>
  <button class="btn" onclick="closeAll()">Close</button>
  <p style="margin-top:28px;font-size:.9rem">Want to surprise someone special?<br><a class="link" id="order" target="_blank" rel="noopener">Order your own surprise →</a></p>
</section>

const cv=$('fx'),cx=cv.getContext('2d');let P=[];
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
const cols=['#d4a94a','#f4b6ad','#fff3d6','#e8a49c','#ffd98a'];
function spark(){P.push({x:Math.random()*cv.width,y:-10,vx:(Math.random()-.5)*.6,vy:.6+Math.random()*1.2,s:2+Math.random()*3,c:cols[Math.random()*5|0],t:'s',l:1})}
function burst(){for(let i=0;i<140;i++){const a=Math.random()*Math.PI*2,v=4+Math.random()*9;P.push({x:cv.width/2,y:cv.height/2.5,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,s:5+Math.random()*5,c:cols[Math.random()*5|0],t:'c',l:1,r:Math.random()*6})}}
setInterval(()=>{if(P.length<90)spark()},220);
(function loop(){cx.clearRect(0,0,cv.width,cv.height);
 P=P.filter(p=>p.y<cv.height+20&&p.l>0);
 for(const p of P){p.x+=p.vx;p.y+=p.vy;cx.fillStyle=p.c;
  if(p.t==='c'){p.vy+=.18;p.vx*=.985;p.l-=.004;p.r+=.2;cx.globalAlpha=Math.max(p.l,0);cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()}
  else{cx.globalAlpha=.5+Math.sin(p.y/15)*.4;cx.beginPath();cx.arc(p.x,p.y,p.s/2,0,7);cx.fill()}}
 cx.globalAlpha=1;requestAnimationFrame(loop)})();

/* ---- Soft music (generated, no files) ---- */
let ac,musicOn=false,timer;
const notes=[523.25,659.25,783.99,659.25,587.33,698.46,880,698.46,523.25,659.25,783.99,1046.5,880,783.99,659.25,587.33];
function startMusic(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();musicOn=true;let i=0;
 const tick=()=>{if(!musicOn)return;const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=notes[i++%notes.length];
  g.gain.setValueAtTime(0,ac.currentTime);g.gain.linearRampToValueAtTime(.07,ac.currentTime+.05);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+1.4);
  o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+1.5)};
 tick();timer=setInterval(tick,650)}catch(e){}}
function stopMusic(){musicOn=false;clearInterval(timer)}
$('mute').onclick=()=>{if(musicOn){stopMusic();$('mute').textContent='🔇'}else{startMusic();$('mute').textContent='🔊'}};

/* ---- Navigation ---- */
function go(n){document.body.classList.toggle('last',n===6);document.querySelectorAll('.screen').forEach((s,i)=>s.classList.toggle('active',i===n));
 if(n===1)burst(); if(n===2)initStory(); if(n===4)revealGifts(); if(n===5)renderWishes(); if(n===6)burst()}
function openGift(){startMusic();$('mute').style.display='block';go(1)}

/* ---- Story ---- */
let si=0,seen=new Set();
function initStory(){si=0;seen.clear();$('dots').innerHTML=CFG.story.map(()=>'<i></i>').join('');showSlide()}
function showSlide(){const s=CFG.story[si];
 $('slide').innerHTML=s.img?`<img src="${s.img}" alt="">`:s.emoji;
 $('cap').textContent=s.text;
 [...$('dots').children].forEach((d,i)=>d.classList.toggle('on',i===si));
 seen.add(si);if(seen.size===CFG.story.length)$('storyNext').style.display='inline-block'}
function slideBy(d){si=(si+d+CFG.story.length)%CFG.story.length;showSlide()}

/* ---- Gifts ---- */
let gifted=false;
function revealGifts(){if(gifted)return;gifted=true;const box=$('gifts');
 box.innerHTML=CFG.gifts.map(g=>`<div class="gift"><span>${g.emoji}</span><b>${g.name}</b><small>${g.note||''}</small></div>`).join('');
 [...box.children].forEach((el,i)=>setTimeout(()=>{el.classList.add('show');burst&&P.length<250&&miniBurst()},900*(i+1)));
 setTimeout(()=>$('giftNext').style.display='inline-block',900*(CFG.gifts.length+1))}
function miniBurst(){for(let i=0;i<25;i++){const a=Math.random()*6.28,v=2+Math.random()*4;P.push({x:cv.width/2,y:cv.height/2,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,s:4,c:cols[Math.random()*5|0],t:'c',l:1,r:0})}}

/* ---- Wishes ---- */
function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}
function renderWishes(){$('wishes').innerHTML=CFG.wishes.map(w=>{
 let body=w.type==='photo'?`<img src="${w.src}" alt="">`:w.type==='video'?`<video controls playsinline src="${w.src}"></video>`:`<div>${esc(w.text||'')}</div>`;
 return `<div class="wish"><b>${esc(w.from)}</b>${w.type!=='text'&&w.text?`<div>${esc(w.text)}</div>`:''}${body}</div>`}).join('')}

/* ---- Close ---- */
function closeAll(){document.body.classList.remove('last');stopMusic();document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
 document.body.insertAdjacentHTML('beforeend','<section class="screen active"><div class="big">💖</div><h2>Happy Anniversary, '+esc(CFG.friend)+'!</h2></section>');$('mute').style.display='none'}
</script>
